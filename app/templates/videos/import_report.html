{% extends "base.html" %}

{% block title %}Informe de Importación{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-10">
        <h2>Informe de importación: {{ report_name }}</h2>
        <pre style="background:#f8f9fa;padding:1rem;border-radius:.25rem;">{{ report | tojson(indent=2) }}</pre>
        <a class="btn btn-secondary" href="{{ url_for('videos.index') }}">Volver a Videos</a>
    </div>
</div>
{% endblock %}
